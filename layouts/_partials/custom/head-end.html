{{- /* GSAP 主畫面動畫 — 只喺首頁載入 (Hextra custom head hook) */ -}}
{{- if .IsHome -}}
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
(function () {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  function run() {
    var hero = document.querySelector("h1.not-prose");
    if (hero) {
      gsap.from(hero, {
        y: 32,
        autoAlpha: 0,
        duration: 0.9,
        ease: "power3.out"
      });
    }
    var cards = document.querySelectorAll("a.hextra-card");
    if (cards.length) {
      gsap.from(cards, {
        y: 24,
        autoAlpha: 0,
        duration: 0.7,
        ease: "power2.out",
        stagger: 0.08,
        delay: 0.35,
        clearProps: "all"
      });
    }
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", run);
  } else {
    run();
  }
})();
</script>
{{- end -}}
