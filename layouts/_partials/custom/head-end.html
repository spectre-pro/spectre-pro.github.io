{{- /* GSAP 主畫面動畫 — 只喺首頁載入 (Hextra custom head hook) */ -}}
{{- if .IsHome -}}
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
(function () {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  function run() {
    var heroEls = document.querySelectorAll(
      ".sv-hero-badge, .sv-hero-title, .sv-hero-sub, .sv-hero-actions, .sv-section-head"
    );
    if (heroEls.length) {
      gsap.from(heroEls, {
        y: 28,
        autoAlpha: 0,
        duration: 0.8,
        ease: "power3.out",
        stagger: 0.12,
        clearProps: "all"
      });
    }
    var cards = document.querySelectorAll("a.hextra-card");
    if (cards.length) {
      gsap.from(cards, {
        y: 24,
        autoAlpha: 0,
        duration: 0.7,
        ease: "power2.out",
        stagger: 0.08,
        delay: 0.45,
        clearProps: "all"
      });
    }
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", run);
  } else {
    run();
  }
})();
</script>
{{- end -}}
<style>
  /* Footer 微調 (全站): 縮細空白 + 分隔點 */
  footer.hextra-footer .hx\:py-12 { padding-block: 2rem; }
  footer.hextra-footer .hextra-custom-footer { padding-top: 0.75rem; }
</style>
